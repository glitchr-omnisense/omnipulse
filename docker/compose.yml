# omnisense/omnipulse with every omnipulse/* provider:
#
#   cp .env.dist .env                              # the platforms' keys and places, when you have them
#   docker compose run --rm omnipulse test         # every package's tests (recorded answers, no network)
#   docker compose run --rm omnipulse bare         # plain PHP: audience reports, a rating and reviews, a funded profile
#                                                  # asked through one Registry - and what PHP loaded
#   docker compose run --rm omnipulse reviews      # the review platforms installed, on their recorded answers (--live: those set in .env)
#   docker compose run --rm omnipulse live         # the checks that need no account (Matomo's demo, Open Collective,
#                                                  # Liberapay), and GitHub Sponsors' when OMNIPULSE_GITHUB_TOKEN is set
#   docker compose run --rm omnipulse phpstan      # PHPStan, each package at the highest level
#   docker compose down -v                         # the harness's volume gone
#
# Providers come from GitHub (branch 1.x) unless their checkout sits under OMNIPULSE_PLUGINS (set it
# to ../.. in .env when this core sits in the workspace beside them): then that checkout is what runs.
# omnisense/contracts likewise: its checkout under OMNISENSE_CONTRACTS (../../../omnisense-contracts
# in .env when it sits beside the family's folder), its tests run with the family's; GitHub otherwise.
name: omnipulse-harness

services:
  omnipulse:
    build: .
    image: omnisense/omnipulse-harness
    # The image may be another family's harness tagged (the same PHP 8.4 Alpine with Composer): the
    # entrypoint is named here, not taken from the image.
    entrypoint: ["/omnipulse/core/docker/entrypoint.sh"]
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    environment:
      OMNIPULSE_GITHUB_TOKEN: ${OMNIPULSE_GITHUB_TOKEN:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnipulse/core
      - ${OMNIPULSE_PLUGINS:-./plugins}:/omnipulse/plugins:ro
      - ${OMNISENSE_CONTRACTS:-./contracts}:/omnisense/contracts:ro
      - harness:/harness

volumes:
  harness:
